[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "pvdaq-rul"
version = "0.1.0"
description = "Find which PVDAQ System 50 data is usable for Remaining Useful Life modelling"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
dependencies = [
  "pandas>=2.0",
  "numpy>=1.24",
  "pyarrow>=14",
  "s3fs>=2023.1",
  "pvlib>=0.10",
  "scipy>=1.10",
  "matplotlib>=3.7",
]

[project.optional-dependencies]
dev = ["pytest>=7", "ruff>=0.4", "nbstripout>=0.7", "pre-commit>=3"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
filterwarnings = ["ignore::FutureWarning"]

[tool.ruff]
line-length = 110
src = ["src", "tests"]
extend-exclude = ["notebooks", "*.md"]   # notebooks are Kaggle-style scripts, kept as written

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["B905"]                # zip(strict=) needs Python 3.10+; fine but noisy here
